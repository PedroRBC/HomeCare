name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run expo:doctor

  prebuild:
    name: Expo prebuild, bundle & Android APK build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0
      - run: bun install --frozen-lockfile
      - name: Generate native project
        run: bunx expo prebuild --platform android --no-install --clean
        env:
          CI: 1
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Bundle JavaScript
        run: bunx expo export --platform android --output-dir dist
        env:
          CI: 1
      - name: Build Android x86_64 E2E APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon --no-parallel -PreactNativeArchitectures=x86_64 assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-e2e-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  android-e2e:
    name: Android UI smoke test
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-e2e-apk
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip" \
            --output "$RUNNER_TEMP/maestro.zip"
          printf '%s  %s\n' "$MAESTRO_SHA256" "$RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            adb install --no-streaming app/app-release.apk
            bash -c 'set +e; maestro test .maestro/auth-navigation.yaml 2>&1 | tee "$RUNNER_TEMP/maestro-test.log"; test_status=${PIPESTATUS[0]}; adb shell uiautomator dump /sdcard/window.xml || true; adb pull /sdcard/window.xml "$RUNNER_TEMP/ui-hierarchy.xml" || true; adb exec-out screencap -p > "$RUNNER_TEMP/screenshot.png" || true; exit "$test_status"'
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
          MAESTRO_CLI_NO_ANALYTICS: "1"
      - name: Upload Android UI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-diagnostics
          path: |
            ${{ runner.temp }}/maestro-test.log
            ${{ runner.temp }}/ui-hierarchy.xml
            ${{ runner.temp }}/screenshot.png
          if-no-files-found: ignore
          retention-days: 3
