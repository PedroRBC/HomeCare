name: Set up the Android toolchain
description: Installs Java 17, Android SDK 36, NDK 27.1.12297006, CMake 3.22.1 and Gradle caching.

inputs:
  gradle-cache:
    description: Use the Gradle cache; only trusted master pushes write it.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: temurin
        java-version: 17
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
        cache-disabled: ${{ inputs.gradle-cache != 'true' }}
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
        build-scan-publish: false
        dependency-graph: disabled
