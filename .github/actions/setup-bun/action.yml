name: Set up Node, Bun and dependencies
description: Installs Node 22 and Bun 1.4.2, then the locked dependencies, and checks their compatibility.

inputs:
  cache:
    description: Restore the Bun download cache; only trusted master pushes save it.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.2
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      if: inputs.cache == 'true'
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-1.4.2-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-1.4.2-
    - run: bun install --frozen-lockfile
      shell: bash
    - run: bun run deps:check
      shell: bash
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      if: inputs.cache == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.bun-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
